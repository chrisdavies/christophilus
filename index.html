<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./games/favicon.svg" />
    <link rel="stylesheet" href="./index.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Christophilus</title>
  </head>
  <body>
    <nav class="site-nav">
      <a href="./" class="logo current"><img src="./games/favicon.svg" alt="Home"></a>
      <a href="./blog/" class="nav-blog">Blog</a>
    </nav>
    <main>
      <section class="links">
        <a href="./blog/" class="mobile-only">Blog</a>
        <a href="./games/tileflip/">Tileflip</a>
        <a href="./games/sokoban/" class="desktop-only">Sokoban</a>
        <a href="./games/memoji/">Memoji</a>
        <a href="./games/blockfit/" class="desktop-only">Blockfit</a>
        <a href="./games/gamepad-diagnostic/" class="desktop-only">Gamepad Diagnostic</a>
      </section>

      <script>
        (function () {
          const app = document.querySelector('main');
          if (!app) {
            return;
          }

          app.insertAdjacentHTML('afterbegin', `<div class="title-tiles-wrapper">
            <div class="title-tiles">${
              'christophilus'
                .padStart(25, ' ')
                .padEnd(35, ' ')
                .split('')
                .map((ch) => `<div class="title-tile">${ch}</div>`)
                .join('')
            }</div>
          </div>`);
        }());
      </script>
    </main>
  </body>
</html>
