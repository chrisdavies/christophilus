<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Christophilus</title>
  <link rel="icon" href="./games/favicon.svg">
  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #0f172a;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #22d3ee;
    }

    html {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 2rem;
    }

    main {
      max-width: 500px;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 300;
      margin: 0 0 1rem;
    }

    .bio {
      color: var(--muted);
      margin-bottom: 2rem;
    }

    nav {
      display: flex;
      gap: 2rem;
      font-size: 1.25rem;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <h1>Christophilus</h1>
    <p class="bio">Software developer. Writer of words. Player of games.</p>
    <nav>
      <a href="./blog/">Blog</a>
      <a href="./games/">Games</a>
    </nav>
  </main>
</body>
</html>
